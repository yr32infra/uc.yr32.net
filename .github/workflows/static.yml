name: Deploy static content to Pages

on:
  push:
    branches: ["master"]

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04
    steps:
      - run: |
          # depName=yanorei32/url-compressor
          URL_COMPRESSOR_VERSION="v0.1.1"
          wget https://github.com/yanorei32/url-compressor/releases/download/$URL_COMPRESSOR_VERSION/static.tar.gz
          tar xf static.tar.gz

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: './static/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
